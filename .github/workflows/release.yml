name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # macOS only: Mellon is a Mac app. In a private repo macOS
    # minutes count 10×, so this runs on tags only and there is no per-push CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release
      - name: Universal app
        run: |
          NAME="Mellon-${GITHUB_REF_NAME#v}"
          mkdir dist
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output target/mellon target/{aarch64,x86_64}-apple-darwin/release/mellon
          scripts/bundle.sh target/mellon dist
          ditto -c -k --keepParent dist/Mellon.app "dist/$NAME-macos-universal.zip"
          hdiutil create -volname Mellon -srcfolder dist/Mellon.app -format UDZO "dist/$NAME-macos-universal.dmg"
          rm -rf dist/Mellon.app
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --pretty='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Mellon ${GITHUB_REF_NAME#v}" --notes-file notes.md
